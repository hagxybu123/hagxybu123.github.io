<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<div class="stage">
  <div class="beam"></div>
  <div class="glow"></div>

    <div class="lines" id="lines"></div>

  </div>
